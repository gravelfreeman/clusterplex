global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option http-keep-alive
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend local_relay
    bind 0.0.0.0:_LOCAL_RELAY_PORT
    bind [::]:_LOCAL_RELAY_PORT

    # Keep the Local Relay limited to the endpoints used by remote workers.
    # HAProxy accepts and canonicalizes identical duplicate Content-Length
    # response headers, while conflicting values remain invalid.
    acl allowed_relay_path path_beg /video/:/transcode/session/ /livetv/
    http-request deny deny_status 404 unless allowed_relay_path

    default_backend pms

backend pms
    server pms 127.0.0.1:_PMS_PORT check
